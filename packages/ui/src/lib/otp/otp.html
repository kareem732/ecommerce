<div class="otp">
  <div class="otp__boxes">
    <p-inputotp
      [ngModel]="code"
      (ngModelChange)="onChange($event)"
      [length]="length()"
      [integerOnly]="true"
      [mask]="mask()"
      [disabled]="disabled()"
      [invalid]="!!error()"
    />
  </div>

  @if (error()) {
  <p class="otp__error" role="alert">{{ error() }}</p>
  }
</div>
