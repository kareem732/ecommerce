<p-tabs [value]="active()" (valueChange)="active.set($any($event))">
  <p-tablist>
    @for (tab of items(); track tab.value) {
    <p-tab [value]="tab.value" [disabled]="!!tab.disabled"
      >{{ tab.label }}</p-tab
    >
    }
  </p-tablist>
  <p-tabpanels>
    @for (tab of items(); track tab.value) {
    <p-tabpanel [value]="tab.value">
      <p class="m-0">{{ tab.content }}</p>
    </p-tabpanel>
    }
  </p-tabpanels>
</p-tabs>
