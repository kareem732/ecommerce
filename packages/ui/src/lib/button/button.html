<button
  class="btn"
  [class]="'btn btn--' + variant()"
  [class.btn--full]="fullWidth()"
  [class.btn--loading]="loading()"
  [type]="type()"
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-busy]="loading()"
  (click)="onClick($event)"
>
  @if (icon() && !loading()) {
    <i [class]="icon()"></i>
  }

  @if (label()) {
    <span>{{ label() }}</span>
  }

  @if (!loading() && endIcon(); as end) {
    <lucide-icon [img]="end" [size]="20" aria-hidden="true"></lucide-icon>
  }

  @if (loading()) {
    <app-spinner [size]="18" />
  }
</button>
