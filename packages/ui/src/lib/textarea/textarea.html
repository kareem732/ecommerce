<div
  class="field"
  [class.field--error]="error()"
  [class.field--disabled]="isDisabled()"
>
  @if (label()) {
  <app-label
    class="field__label"
    [text]="label()"
    [for]="id"
    [error]="!!error()"
  />
  }

  <textarea
    class="field__textarea"
    [id]="id"
    [rows]="rows()"
    [placeholder]="placeholder()"
    [value]="value()"
    [disabled]="isDisabled()"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>

  @if (error()) {
  <span class="field__error">{{ error() }}</span>
  }
</div>
