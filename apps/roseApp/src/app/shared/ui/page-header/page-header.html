<header class="flex flex-col gap-2" [class.items-center]="centered()" [class.text-center]="centered()">
  <h1 class="text-3xl font-bold text-(--text-heading) sm:text-4xl">{{ titleKey() | translate }}</h1>
  @if (subtitleKey(); as subtitle) {
    <p class="max-w-2xl text-(--text-secondary)">{{ subtitle | translate }}</p>
  }
</header>
