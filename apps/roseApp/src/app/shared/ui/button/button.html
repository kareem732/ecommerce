<button
  class="btn"
  [class]="'btn btn--' + variant()"
  [class.btn--full]="fullWidth()"
  [class.btn--loading]="loading()"
  [type]="type()"
  [disabled]="isDisabled()"
  (click)="onClick($event)"
>
  @if (loading()) {
    <i class="pi pi-spin pi-spinner"></i>
  }
  <span>{{ label() }}</span>
  @if (!loading() && icon()) {
    <i [class]="icon()" [style.color]="iconColor() || null"></i>
  }
</button>
