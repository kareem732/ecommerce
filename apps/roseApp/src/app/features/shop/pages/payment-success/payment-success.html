<div
  class="page-container flex min-h-[60vh] flex-col items-center justify-center gap-5 py-16 text-center"
>
  <div
    class="flex h-20 w-20 items-center justify-center rounded-full bg-[var(--bg-success-subtle)]"
  >
    <lucide-icon
      [img]="circleCheck"
      [size]="48"
      class="text-[var(--color-success)]"
      aria-hidden="true"
    />
  </div>

  <h1 class="font-primary text-2xl font-bold text-[var(--text-heading)] sm:text-3xl">
    {{ 'SHOP.PAYMENT.SUCCESS_TITLE' | translate }}
  </h1>

  <p class="max-w-md font-primary text-base text-[var(--text-secondary)]">
    {{ 'SHOP.PAYMENT.SUCCESS_SUBTITLE' | translate }}
  </p>

  <a
    routerLink="/shop/home"
    class="mt-2 inline-flex h-11 items-center justify-center rounded-[10px] bg-[var(--btn-brand-bg)] px-6 font-primary text-sm font-medium text-[var(--btn-brand-text)] transition-opacity hover:opacity-90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[var(--btn-brand-bg)] focus-visible:ring-offset-2"
  >
    {{ 'SHOP.PAYMENT.CONTINUE_SHOPPING' | translate }}
  </a>
</div>
