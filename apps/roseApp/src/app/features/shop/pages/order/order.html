<section class="mx-auto w-full max-w-7xl px-4 py-8 sm:px-6 sm:py-12 lg:px-8">
  <app-page-header class="mb-6 block" titleKey="ORDERS.TITLE" />

  @if (orders.items(); as list) {
    <div class="flex flex-col gap-6">
      @for (order of list; track order.id) {
        <app-order-card [order]="order" />
      } @empty {
        <p class="py-16 text-center text-xl font-semibold text-(--text-strong)">
          {{ 'ORDERS.EMPTY' | translate }}
        </p>
      }
    </div>

    @if (orders.total() > orders.pageSize) {
      <app-pagination
        class="mt-8"
        [totalRecords]="orders.total()"
        [rows]="orders.pageSize"
        [pageLinks]="5"
        [first]="first()"
        (pageChange)="onPageChange($event)"
      />
    }
  } @else {
    <p class="py-12 text-center text-(--text-secondary)" role="status">
      {{ 'ORDERS.LOADING' | translate }}
    </p>
  }
</section>
