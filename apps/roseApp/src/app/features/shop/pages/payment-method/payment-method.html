<app-checkout-steps [currentStep]="2" />

<div class="mt-6">
  <a
    routerLink="/shop/cart/shipping-address"
    class="inline-flex items-center gap-1.5 font-primary text-sm font-medium text-[var(--text-secondary)] transition-colors hover:text-[var(--text-accent)]"
  >
    <lucide-icon [img]="arrowLeft" [size]="16" class="rtl:rotate-180" aria-hidden="true" />
    {{ 'SHOP.PAYMENT.BACK' | translate }}
  </a>
</div>

<h1
  class="mt-3 mb-5 font-primary text-2xl font-semibold leading-none text-[var(--text-heading)] sm:text-[30px]"
>
  {{ 'SHOP.PAYMENT.TITLE' | translate }}
</h1>

<div
  role="radiogroup"
  class="grid max-w-[756px] grid-cols-1 gap-2.5 sm:grid-cols-2"
  [attr.aria-label]="'SHOP.PAYMENT.TITLE' | translate"
>
  @for (option of options; track option.method) {
    <button
      type="button"
      role="radio"
      [attr.aria-checked]="selected() === option.method"
      (click)="select(option.method)"
      class="flex h-[299px] max-w-[373px] cursor-pointer flex-col items-center justify-center gap-2.5 rounded-xl border bg-[var(--bg-card)] p-4 text-center transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-[#A6252A]"
      [style.border-color]="selected() === option.method ? '#A6252A' : 'var(--border-input)'"
      [style.border-width.px]="selected() === option.method ? 2 : 1"
    >
      <img
        [src]="option.image"
        [alt]="option.titleKey | translate"
        class="h-[150px] w-[150px] shrink-0 object-contain sm:h-[180px] sm:w-[180px] dark:invert"
      />
      <span
        class="font-primary text-base font-semibold"
        [style.color]="selected() === option.method ? '#A6252A' : 'var(--text-strong)'"
      >
        {{ option.titleKey | translate }}
      </span>
      <span class="max-w-[280px] font-primary text-sm text-[var(--text-secondary)]">
        {{ option.subtitleKey | translate }}
      </span>
    </button>
  }
</div>

<div class="mt-6 flex justify-end">
  <app-button
    [label]="'SHOP.PAYMENT.CHECKOUT' | translate"
    [endIcon]="arrowRight"
    [loading]="loading()"
    [bgColor]="'var(--btn-brand-bg)'"
    [textColor]="'var(--btn-brand-text)'"
    (clicked)="onCheckout()"
  />
</div>
