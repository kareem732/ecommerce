
<section class="w-full min-w-0 max-w-full overflow-x-clip">

  <div class="page-container">
    <div class="flex flex-col items-center justify-center text-center">
      <span class="font-['Sarabun'] text-base font-bold leading-none tracking-[0.25em] uppercase text-[#E65073] dark:text-[#D75458]">
        {{ 'SHOP.TESTIMONIALS.LABEL' | translate }}
      </span>

      <app-section-title class="mt-2 max-w-full">{{ 'SHOP.TESTIMONIALS.TITLE' | translate }}</app-section-title>
    </div>
  </div>

  <div class="mt-8 w-full min-w-0 max-w-full overflow-x-clip bg-[#FBEAEA] py-12 dark:bg-zinc-700 md:mt-10 md:py-16">
    <div class="page-container">
      <div class="grid w-full min-w-0 grid-cols-1 justify-items-center gap-x-6 gap-y-16 sm:grid-cols-2 lg:grid-cols-3">
        @for (item of testimonials(); track item.id) {
          <app-testimonial-card
            class="block w-full min-w-0 max-w-sm"
            [testimonial]="item"
          />
        }
      </div>
    </div>
  </div>

</section>
