<div class="py-10">
  <div class="text-center mb-10">
    <h1
      class="text-(--color-maroon-400) text-[16px] font-bold leading-none tracking-[0.25em] uppercase font-sarabun mb-3"
    >
      {{ 'SHOP.testimonials.label' | translate }}
    </h1>
    <app-section-title>{{ 'SHOP.testimonials.title' | translate }}</app-section-title>
  </div>
  <div class="bg-zinc-700 p-2.5 w-full !min-h-[550px] flex items-center">
    <div class="mx-auto grid w-full max-w-7xl grid-cols-1 justify-items-center gap-3 md:grid-cols-2 xl:grid-cols-3">
        @for (t of testimonials(); track t.id) {
        <app-testimonial-card [testimonial]="t"></app-testimonial-card>
        }
    </div>
  </div>
</div>
