<section class="you-may-like">
  <app-section-title>
    <span class="accent">{{ 'SHOP.YOU_MAY_LIKE.TITLE.ACCENT' | translate }}</span>
    {{ 'SHOP.YOU_MAY_LIKE.TITLE.REST' | translate }}
  </app-section-title>

  <div class="you-may-like__slider">
    <app-carousel [items]="products()" [numVisible]="4">
      <ng-template #itemTemplate let-product>
        <app-product-card [product]="product" (addToCart)="onAddToCart($event)" />
      </ng-template>
    </app-carousel>
  </div>
</section>
