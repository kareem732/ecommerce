<section class="most-popular">
  <header class="most-popular__header">
    <app-section-title>{{ 'SHOP.MOST_POPULAR.TITLE' | translate }}</app-section-title>

    <app-occasion-filter
      [occasions]="occasions()"
      [selectedId]="selectedId()"
      (selectedChange)="onSelectOccasion($event)"
    />
  </header>

  @if (!loading() && products().length === 0) {
    <p class="most-popular__empty">{{ 'SHOP.MOST_POPULAR.EMPTY' | translate }}</p>
  } @else {
    <div class="most-popular__grid" [class.most-popular__grid--loading]="loading()">
      @for (product of products(); track product.id) {
        <app-product-card [product]="product" (addToCart)="onAddToCart($event)" />
      }
    </div>
  }

  <a class="most-popular__more" routerLink="/shop/products">
    <span>{{ 'SHOP.MOST_POPULAR.VIEW_MORE' | translate }}</span>
    <lucide-angular [img]="ArrowRight" [size]="16" />
  </a>
</section>
