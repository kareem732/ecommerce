<section class="promo">
  <div class="promo__top">
    <app-promo-card class="promo__special" [banner]="specialGifts" [priority]="true" />
    <app-hero-slider class="promo__hero" [slides]="heroSlides" [interval]="autoplayInterval" />
  </div>

  <div class="promo__occasions">
    @for (banner of occasions; track banner.id) {
      <app-promo-card class="promo__occasion" [banner]="banner" />
    }
  </div>
</section>
