<section [attr.lang]="currentLanguage()" [attr.dir]="currentLanguage() === 'ar' ? 'rtl' : 'ltr'"
  class="mt-16 md:mt-24 lg:mt-33.25 mb-16 overflow-x-clip">

  <div class="w-full flex flex-col">

    <div class="flex flex-col items-center justify-center text-center">
      <span class="font-['Sarabun'] text-base font-bold leading-none tracking-[0.25em] uppercase text-[#D75458]">
        {{'GALLERY.LABEL' | translate}}
      </span>

      <app-section-title class="mt-2">{{'GALLERY.TITLE_REST' | translate}}</app-section-title>
    </div>

    <div class="mt-8 md:mt-10 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5 lg:gap-6">

      <div class="min-w-0 flex flex-col gap-3.5 lg:aspect-[3/7]">
        <img class="block w-full max-w-full min-h-0 object-cover rounded-lg aspect-[4/3] lg:aspect-auto lg:flex-[3]"
          src="Frame74.png" [alt]="'GALLERY.IMAGE_1_ALT' | translate" loading="lazy" />

        <img class="block w-full max-w-full min-h-0 object-cover rounded-lg aspect-[4/3] lg:aspect-auto lg:flex-[2]"
          src="Frame79.png" [alt]="'GALLERY.IMAGE_2_ALT' | translate" loading="lazy" />
      </div>

      <div class="min-w-0 flex flex-col gap-3.5 lg:aspect-[3/7]">
        <img class="block w-full max-w-full min-h-0 object-cover rounded-lg aspect-[4/3] lg:aspect-auto lg:flex-[2]"
          src="Ga.png" [alt]="'GALLERY.IMAGE_3_ALT' | translate" loading="lazy" />

        <img class="block w-full max-w-full min-h-0 object-cover rounded-lg aspect-[4/3] lg:aspect-auto lg:flex-[3]"
          src="Frame78.png" [alt]="'GALLERY.IMAGE_4_ALT' | translate" loading="lazy" />
      </div>

      <div class="min-w-0 flex flex-col sm:flex-row lg:flex-col gap-3.5 sm:gap-5 lg:gap-3.5 sm:col-span-2 lg:col-span-1 lg:aspect-[3/7]">
        <img class="block w-full max-w-full min-w-0 min-h-0 object-cover rounded-lg aspect-[4/3] sm:flex-1 lg:aspect-auto lg:flex-[2]"
          src="Frame76.png" [alt]="'GALLERY.IMAGE_5_ALT' | translate" loading="lazy" />

        <img class="block w-full max-w-full min-w-0 min-h-0 object-cover rounded-lg aspect-[4/3] sm:flex-1 lg:aspect-auto lg:flex-[3]"
          src="Frame80.png" [alt]="'GALLERY.IMAGE_6_ALT' | translate" loading="lazy" />
      </div>

    </div>
  </div>
</section>
