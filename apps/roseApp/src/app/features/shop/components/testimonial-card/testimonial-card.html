<div class="pt-20">
  <div class="card relative bg-white rounded-3xl flex flex-col gap-3">
    <div
      class="absolute w-30 h-30 rounded-full overflow-hidden top-[-75.5px] left-1/2 -translate-x-1/2 border-3 border-white"
    >
      <img [src]="testimonial.image ?? 'avatar.png'" alt="" class="size-full rounded-full object-cover" />
    </div>
    <h3
      class="text-zinc-600 font-semibold text-[16px] font-sarabun text-center"
    >
      {{ testimonial.name }}
    </h3>
    <div class="mt-3 flex flex-col gap-2.5">
      <div class="flex h-3.75 items-center gap-1 justify-center">
        @for(filled of stars; track $index){
        <span [class]="filled ? 'text-amber-400' : 'text-amber-300'">
          {{ filled ? '★' : '☆' }}
        </span>
        }
      </div>
      <p class="line-clamp-3 text-[16px] text-zinc-800 font-medium text-center">
        {{ testimonial.content }}
      </p>
    </div>
    <time class="mt-auto text-center text-xs text-zinc-400"
      >{{ testimonial.createdAt | date: 'MMMM d, y' }}</time
    >
  </div>
</div>
