<section class="related">
  <app-section-title>
    <span class="accent">Related</span> Products
  </app-section-title>

  <div class="related__slider">
    <app-carousel [items]="products()" [numVisible]="4">
      <ng-template #itemTemplate let-product>
        <app-product-card [product]="product" (addToCart)="onAddToCart($event)" />
      </ng-template>
    </app-carousel>
  </div>
</section>
