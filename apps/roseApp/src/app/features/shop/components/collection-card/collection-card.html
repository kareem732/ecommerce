@let c = item();

<a
  [routerLink]="c.link"
  [queryParams]="c.queryParams"
  class="group flex h-full flex-col overflow-hidden rounded-2xl border border-(--border-default) bg-(--bg-surface) shadow-sm transition-shadow hover:shadow-md focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-(--border-focus)"
>
  <div class="aspect-4/3 overflow-hidden bg-(--color-primary-subtle)">
    @if (c.image) {
      <img
        [src]="c.image"
        [alt]="c.title"
        loading="lazy"
        class="size-full object-cover transition-transform duration-300 group-hover:scale-105"
      />
    } @else {
      <span class="grid size-full place-items-center text-(--text-accent)" aria-hidden="true">
        <lucide-angular [img]="Gift" [size]="48" [strokeWidth]="1.25" />
      </span>
    }
  </div>

  <div class="flex flex-1 flex-col gap-1 p-4">
    <h2 class="text-lg font-semibold text-(--text-title-brand)">{{ c.title }}</h2>
    @if (c.productCount !== null) {
      <p class="text-xs font-medium text-(--text-secondary)">
        {{ 'COLLECTIONS.PRODUCTS_COUNT' | translate: { count: c.productCount } }}
      </p>
    }
    @if (c.subtitle) {
      <p class="line-clamp-2 text-sm text-(--text-secondary)">{{ c.subtitle }}</p>
    }
    <span class="mt-auto flex items-center gap-1 pt-2 text-sm font-medium text-(--text-accent)">
      {{ 'COMMON.SHOP_NOW' | translate }}
      <lucide-angular
        [img]="ArrowRight"
        [size]="16"
        class="transition-transform group-hover:translate-x-1 rtl:-scale-x-100 rtl:group-hover:-translate-x-1"
        aria-hidden="true"
      />
    </span>
  </div>
</a>
