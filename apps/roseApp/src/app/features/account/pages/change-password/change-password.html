<form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4" novalidate>
  <app-input
    formControlName="currentPassword"
    type="password"
    placeholder="********"
    [label]="'ACCOUNT.PASSWORD.CURRENT' | translate"
    [error]="currentPasswordError()"
  />

  <hr class="my-2 border-(--border-default)" />

  <app-input
    formControlName="newPassword"
    type="password"
    placeholder="********"
    [label]="'ACCOUNT.PASSWORD.NEW' | translate"
    [error]="newPasswordError()"
  />
  <app-input
    formControlName="confirmPassword"
    type="password"
    placeholder="********"
    [label]="'ACCOUNT.PASSWORD.CONFIRM' | translate"
    [error]="confirmPasswordError()"
  />

  <div class="mt-10 flex justify-end">
    <app-button
      type="submit"
      class="w-full sm:w-auto sm:min-w-52"
      [label]="'ACCOUNT.PASSWORD.SUBMIT' | translate"
      [loading]="loading()"
      [fullWidth]="true"
    />
  </div>
</form>
