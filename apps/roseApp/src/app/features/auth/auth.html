<main
  [dir]="language.direction()"
  class="grid min-h-dvh grid-cols-1 bg-white text-zinc-800 dark:bg-zinc-900 dark:text-zinc-100 md:grid-cols-[36fr_38fr]"
>
  <section class="flex min-w-0 items-center justify-center px-6 py-10 sm:px-10 lg:px-16">
    <div class="mx-auto w-full max-w-md">
      <div class="mb-10 flex min-h-10 items-center justify-between gap-3">
        <app-theme-toggle></app-theme-toggle>
        <button
          type="button"
          class="text-xs font-normal text-zinc-800 dark:text-zinc-100"
          [disabled]="language.loading()"
          [attr.lang]="language.currentLang() === 'en' ? 'ar' : 'en'"
          (click)="language.changeLanguage(language.currentLang() === 'en' ? 'ar' : 'en')"
        >
          {{ 'COMMON.SWITCH_LANGUAGE' | translate }}
        </button>
      </div>

      <img
        src="/auth-aside-up.webp"
        alt=""
        aria-hidden="true"
        class="mx-auto block h-auto w-7/10"
      />

      <div class="my-10 min-w-0 [&>router-outlet]:hidden">
        <router-outlet></router-outlet>
      </div>

      <img
        src="/auth-aside-down.webp"
        alt=""
        aria-hidden="true"
        class="mx-auto block h-auto w-7/10"
      />
    </div>
  </section>

  <aside
    aria-hidden="true"
    class="sticky top-0 hidden h-dvh self-start overflow-hidden md:block"
  >
    <img
      src="/imageCover.png"
      alt=""
      class="block h-full w-full object-cover object-center"
    />
  </aside>
  <app-toast-host />
</main>
