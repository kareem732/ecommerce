<main [dir]="language.direction()"
  class="grid h-full min-h-screen h-screen min-h-dvh h-dvh max-h-dvh w-full grid-cols-1 grid-rows-1 overflow-hidden bg-white text-zinc-800 dark:bg-zinc-900 dark:text-zinc-100 md:grid-cols-[36fr_38fr]">
  <section
    class="flex h-full min-h-full min-w-0 flex-col justify-between overflow-y-auto px-4 py-3 sm:px-8 sm:py-5 lg:px-12 [scrollbar-width:none] [-ms-overflow-style:none] [&::-webkit-scrollbar]:hidden">
    <!-- Top bar: Theme Toggle & Language Switch -->
    <header class="flex min-h-8 shrink-0 items-center justify-between gap-3">
      <app-theme-toggle></app-theme-toggle>
      <button type="button" class="text-xs font-normal text-zain hover:opacity-80 transition-opacity"
        [disabled]="language.loading()" [attr.lang]="language.currentLang() === 'en' ? 'ar' : 'en'"
        (click)="language.changeLanguage(language.currentLang() === 'en' ? 'ar' : 'en')">
        {{ 'COMMON.SWITCH_LANGUAGE' | translate }}
      </button>
    </header>

    <!-- Unified Auth Card: Keeps ornaments tightly attached to the form and centered in the viewport -->
    <div class="my-auto mx-auto flex w-full max-w-md flex-col justify-center py-2 sm:py-4">
      <img src="/auth-aside-up.webp" alt="" aria-hidden="true"
        class="mx-auto block h-7 sm:h-9 md:h-10 w-auto max-w-[220px] object-contain shrink-0" />

      <div class="my-2 min-w-0 sm:my-3 [&>router-outlet]:hidden">
        <router-outlet></router-outlet>
      </div>

      <img src="/auth-aside-down.webp" alt="" aria-hidden="true"
        class="mx-auto block h-7 sm:h-9 md:h-10 w-auto max-w-[220px] object-contain shrink-0" />
    </div>

    <!-- Bottom balanced spacer -->
    <footer class="h-8 shrink-0" aria-hidden="true"></footer>
  </section>

  <aside aria-hidden="true" class="hidden h-full min-h-full max-h-dvh overflow-hidden md:block">
    <img src="/imageCover.png" alt="" class="block h-full w-full object-cover object-center" />
  </aside>
  <app-toast-host />
</main>
