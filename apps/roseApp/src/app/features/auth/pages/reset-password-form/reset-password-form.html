<div class="flex flex-col gap-6">
  <div>
    <h1 class="text-[var(--color-zinc-800)] font-bold text-[24px]">
      Create a new password
    </h1>
    <div class="border-b border-[var(--color-zinc-200)] pb-1">
      <p class="text-[var(--color-zinc-800)]">
        Set a strong password to secure your account.
      </p>
    </div>
  </div>

  <div>
    <form
      [formGroup]="resetPasswordForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-6"
    >
      <app-input
        label="Password"
        placeholder="Enter your password"
        type="password"
        formControlName="password"
        [error]="passwordError"
      />
      <app-input
        label="Confirm Password"
        placeholder="Re-enter your password"
        type="password"
        formControlName="confirmPassword"
        [error]="confirmPasswordError"
      />
      <app-button
        label="Reset Password"
        variant="primary"
        [fullWidth]="true"
        [loading]="loading()"
        type="submit"
      />
    </form>
  </div>

  <div class="border-t border-[var(--color-zinc-200)] pt-6">
    <p class="text-center font-semibold text-[var(--color-zinc-800)]">
      Need help?
      <a routerLink="/" class="!text-[var(--color-maroon-700)]">Contact us</a>
    </p>
  </div>
</div>
