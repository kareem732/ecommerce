<div class="flex flex-col gap-6">
  <div>
    <h1 class="text-[var(--color-zinc-800)] font-bold text-[24px]">
      Forget Password
    </h1>
    <div class=" border-b border-[var(--color-zinc-200)] pb-1"><p class="text-[var(--color-zinc-800)]">
      Worry not, we’ll send you instructions to help you reset it.
    </p></div>
    
  </div>
  <div>
    <form
      [formGroup]="forgetPasswordForm"
      (ngSubmit)="onSubmit()"
      class="flex flex-col gap-6"
    >
      <app-input
        label="Email"
        placeholder="User@example.com"
        type="email"
        formControlName="email"
        [error]="emailError"
      />
      <app-button
        label="Next"
        variant="primary"
        [fullWidth]="true"
        icon="pi pi-arrow-right"
        iconColor="#ffffff"
        type="submit"
      />
    </form>
  </div>

  <div class=" border-t border-[var(--color-zinc-200)] pt-6">  <p class="text-[var(--color-zinc-800)] text-center font-semibold">
    Don’t have an account yet?<a
      routerLink="/"
      class="!text-[var(--color-maroon-700)]">
      Create one now!</a>
    
  </p></div>
  

</div>
