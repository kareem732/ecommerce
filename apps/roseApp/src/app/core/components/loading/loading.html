@if (isLoading()) {
  <div
    class="fixed inset-0 z-50 flex items-center justify-center bg-black/25 dark:bg-black/50 backdrop-blur-xs transition-opacity duration-200"
    role="status"
    aria-live="polite"
    aria-busy="true"
    [attr.aria-label]="loadingLabel() | translate"
  >
    <div
      class="flex flex-col items-center gap-3 rounded-2xl bg-[var(--bg-surface)] px-6 py-5 shadow-2xl border border-[var(--border-default)] transition-all motion-reduce:transition-none"
    >
      <p-progressSpinner
        strokeWidth="4"
        fill="transparent"
        animationDuration=".8s"
        [ariaLabel]="loadingLabel() | translate"
        [style]="{ width: '44px', height: '44px' }"
      />
      <span class="text-sm font-medium text-[var(--text-primary)] select-none">
        {{ loadingLabel() | translate }}
      </span>
    </div>
  </div>
}
