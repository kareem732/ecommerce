<p-button [label]="config().label" [icon]="config().icon" [iconPos]="iconPos()" [severity]="config().severity"
  [size]="config().size" [outlined]="config().outlined" [text]="config().text" [raised]="config().raised"
  [rounded]="config().rounded" [disabled]="disabled()" [loading]="loading()" [type]="btnType()"
  [styleClass]="buttonClass()" (onClick)="onClicked($event)">
</p-button>
