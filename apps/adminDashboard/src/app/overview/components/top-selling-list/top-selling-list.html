<ul class="flex max-h-72 flex-col gap-2 overflow-y-auto">
  @for (product of products(); track product.productId) {
    <li
      class="flex items-center justify-between gap-3 rounded-lg px-3 py-2"
      data-testid="row"
    >
      <p
        class="flex min-w-0 items-baseline gap-1 font-[family-name:Inter,ui-sans-serif,system-ui,sans-serif] leading-[100%] tracking-normal text-[#2E2E30] dark:text-slate-100"
      >
        <span class="truncate text-[16px] font-semibold" data-testid="title">{{ product.title }}</span>
        <span class="shrink-0 text-[12px] font-normal" data-testid="price">
          ({{ product.unitPrice | number: '1.0-2' }} {{ currency() }})
        </span>
      </p>

      <span
        class="shrink-0 text-right font-[family-name:Inter,ui-sans-serif,system-ui,sans-serif] text-[14px] font-bold leading-[100%] tracking-normal text-[#2E2E30] dark:text-slate-200"
        data-testid="sales"
      >
        {{ 'ADMIN.OVERVIEW.SALES_COUNT' | translate: { count: product.totalSales } }}
      </span>
    </li>
  }
</ul>
