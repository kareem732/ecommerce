<ul class="max-h-72 divide-y divide-slate-100 overflow-y-auto dark:divide-slate-800">
  @for (row of rows(); track row.id) {
    <li class="flex items-center justify-between gap-3 py-2.5" data-testid="row">
      <span
        class="truncate font-[family-name:Inter,ui-sans-serif,system-ui,sans-serif] text-[16px] font-normal leading-[100%] tracking-normal text-[#27272A] dark:text-slate-200"
        data-testid="title"
      >
        {{ row.title }}
      </span>
      <span
        dir="ltr"
        class="shrink-0 whitespace-nowrap text-right font-[family-name:Inter,ui-sans-serif,system-ui,sans-serif] text-[14px] font-medium leading-[100%] tracking-normal"
        [class]="row.toneClass"
        data-testid="stock"
      >
        {{ 'ADMIN.OVERVIEW.PRODUCTS_COUNT' | translate: { count: row.stock } }}
      </span>
    </li>
  }
</ul>
