<div class="flex w-full flex-row items-center justify-center gap-[52px] lg:mx-auto lg:flex-col lg:gap-10">
  <div
    class="size-[170px] shrink-0 sm:size-[220px] lg:size-[170.6px]"
    role="img"
    [attr.aria-label]="'ADMIN.OVERVIEW.ORDERS_STATUS' | translate"
  >
    <p-chart
      type="doughnut"
      width="100%"
      height="100%"
      [data]="data()"
      [options]="options"
      [plugins]="plugins"
    />
  </div>

  <ul
    class="grid min-w-0 grid-cols-[auto_auto] justify-start gap-x-3 gap-y-4 font-[family-name:Inter,ui-sans-serif,system-ui,sans-serif] text-[12px] font-semibold leading-[100%] tracking-normal text-[#2E2E30] dark:text-slate-200 lg:w-full lg:grid-cols-[1fr_auto]"
  >
    @for (row of legend(); track row.key) {
      <li class="contents" data-testid="legend-row">
        <span class="flex items-center gap-2 whitespace-nowrap">
          <span class="size-2.5 shrink-0 rounded-full" [style.background-color]="row.color"></span>
          {{ row.key | translate }}
        </span>
        <span class="flex items-center justify-end gap-2 whitespace-nowrap" data-testid="legend-value">
          <span>{{ row.count | number }}</span>
          <span>({{ row.percent | number: '1.0-1' }}%)</span>
        </span>
      </li>
    }
  </ul>
</div>
