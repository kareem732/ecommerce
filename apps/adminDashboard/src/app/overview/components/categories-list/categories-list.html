<ul class="max-h-72 divide-y divide-slate-100 overflow-y-auto dark:divide-slate-800">
  @for (category of categories(); track category.id) {
    <li class="flex items-center justify-between gap-3 py-3" data-testid="row">
      <span
        class="relative -top-2 truncate font-[family-name:Inter,ui-sans-serif,system-ui,sans-serif] text-[16px] font-normal leading-[100%] tracking-normal text-[#27272A] dark:text-slate-200"
        data-testid="title"
      >
        {{ category.title }}
      </span>
      <span
        class="shrink-0 rounded-md bg-[#0000000D] px-3 py-1.5 font-[family-name:Inter,ui-sans-serif,system-ui,sans-serif] text-[14px] font-medium leading-[100%] tracking-normal text-[#27272A] dark:bg-white/10 dark:text-slate-200"
        data-testid="count"
      >
        {{ 'ADMIN.OVERVIEW.PRODUCTS_COUNT' | translate: { count: category.productCount } }}
      </span>
    </li>
  }
</ul>
